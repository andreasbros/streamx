# Tag-triggered release: builds every platform artifact and attaches it
# to the GitHub release created by `nix run .#release`.
name: release
on:
  push:
    tags: ["v*"]
  # Reused by cut-release.yml: tags it pushes with the workflow token
  # cannot trigger `on: push`, so it calls this workflow directly.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Linux artifacts build in parallel: wall-clock is the slowest single
  # artifact, not the sum. Each job runs only its own linkage check;
  # clippy/fmt/tests are CI's job on every push, not the release's.
  linux-server-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v15
        with:
          name: streamx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build + linkage check
        run: |
          nix build .#streamx-x86_64-linux-musl --out-link out
          nix build .#checks.x86_64-linux.linkage-server-x86_64-musl
      - name: Upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p dist
          install -m755 out/bin/streamx dist/streamx-x86_64-linux-musl
          gh release upload "${{ inputs.tag || github.ref_name }}" dist/* --clobber

  # Native ARM runner (free for public repos): no cross toolchain to
  # build and far better upstream cache coverage than cross-compiling.
  linux-server-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v15
        with:
          name: streamx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build + linkage check
        run: |
          nix build .#streamx-aarch64-linux-musl --out-link out
          nix build .#checks.aarch64-linux.linkage-server-aarch64-musl
      - name: Upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p dist
          install -m755 out/bin/streamx dist/streamx-aarch64-linux-musl
          gh release upload "${{ inputs.tag || github.ref_name }}" dist/* --clobber

  linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v15
        with:
          name: streamx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build + linkage check
        run: |
          nix build .#streamx-desktop-dist --out-link out
          nix build .#checks.x86_64-linux.linkage-desktop-dist
      - name: Upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p dist
          tar -C out -czf dist/streamx-desktop-x86_64-linux.tar.gz .
          gh release upload "${{ inputs.tag || github.ref_name }}" dist/* --clobber

  macos:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            extra-platforms = x86_64-darwin
      - uses: cachix/cachix-action@v15
        with:
          name: streamx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Import Developer ID certificate (when configured)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "no signing certificate configured; artifacts will be ad-hoc signed"
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PW=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 -d > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN"             -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:             -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN"             | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing as: $IDENTITY"
      - name: Prepare notarization credentials (when configured)
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY" ]; then
            echo "notarization not configured; artifacts will not be notarized"
            exit 0
          fi
          echo "$APP_STORE_CONNECT_KEY" | base64 -d > "$RUNNER_TEMP/asc.p8"
          {
            echo "NOTARY_KEY_FILE=$RUNNER_TEMP/asc.p8"
            echo "NOTARY_KEY_ID=$APP_STORE_CONNECT_KEY_ID"
            echo "NOTARY_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Build, sign, notarize dmgs (Apple Silicon + Intel via Rosetta)
        run: |
          nix develop --command scripts/release.sh aarch64-apple-darwin dist/StreamX-aarch64.dmg
          nix develop --command scripts/release.sh x86_64-apple-darwin dist/StreamX-x86_64.dmg
      - name: Upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ inputs.tag || github.ref_name }}" dist/*.dmg --clobber
