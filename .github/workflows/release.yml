# Tag-triggered release: builds every platform artifact and attaches it
# to the GitHub release created by `nix run .#release`.
name: release
on:
  push:
    tags: ["v*"]
  # Reused by cut-release.yml: tags it pushes with the workflow token
  # cannot trigger `on: push`, so it calls this workflow directly.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Linux artifacts build in parallel: wall-clock is the slowest single
  # artifact, not the sum. Each job runs only its own linkage check;
  # clippy/fmt/tests are CI's job on every push, not the release's.
  linux-server-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v15
        with:
          name: streamx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build + linkage check
        run: |
          nix build .#streamx-x86_64-linux-musl --out-link out
          nix build .#checks.x86_64-linux.linkage-server-x86_64-musl
      - name: Upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p dist
          install -m755 out/bin/streamx dist/streamx-x86_64-linux-musl
          gh release upload "${{ inputs.tag || github.ref_name }}" dist/* --clobber

  # Native ARM runner (free for public repos): no cross toolchain to
  # build and far better upstream cache coverage than cross-compiling.
  linux-server-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v15
        with:
          name: streamx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build + linkage check
        run: |
          nix build .#streamx-aarch64-linux-musl --out-link out
          nix build .#checks.aarch64-linux.linkage-server-aarch64-musl
      - name: Upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p dist
          install -m755 out/bin/streamx dist/streamx-aarch64-linux-musl
          gh release upload "${{ inputs.tag || github.ref_name }}" dist/* --clobber

  linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v15
        with:
          name: streamx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build + linkage check
        run: |
          nix build .#streamx-desktop-dist --out-link out
          nix build .#checks.x86_64-linux.linkage-desktop-dist
      - name: Upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p dist
          tar -C out -czf dist/streamx-desktop-x86_64-linux.tar.gz .
          gh release upload "${{ inputs.tag || github.ref_name }}" dist/* --clobber

  macos:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            extra-platforms = x86_64-darwin
      - uses: cachix/cachix-action@v15
        with:
          name: streamx
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Import Developer ID certificate (when configured)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "no signing certificate configured; artifacts will be ad-hoc signed"
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PW=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 -d > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN"             -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:             -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN"             | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing as: $IDENTITY"
      - name: Prepare notarization credentials (when configured)
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY" ]; then
            echo "notarization not configured; artifacts will not be notarized"
            exit 0
          fi
          echo "$APP_STORE_CONNECT_KEY" | base64 -d > "$RUNNER_TEMP/asc.p8"
          {
            echo "NOTARY_KEY_FILE=$RUNNER_TEMP/asc.p8"
            echo "NOTARY_KEY_ID=$APP_STORE_CONNECT_KEY_ID"
            echo "NOTARY_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Build, sign, notarize dmgs (Apple Silicon + Intel via Rosetta)
        run: |
          nix develop --command scripts/release.sh aarch64-apple-darwin dist/StreamX-aarch64.dmg
          nix develop --command scripts/release.sh x86_64-apple-darwin dist/StreamX-x86_64.dmg
      - name: Upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ inputs.tag || github.ref_name }}" dist/*.dmg --clobber

  # Windows desktop, both architectures on native runners. No Nix on
  # Windows: rustup reads rust-toolchain.toml, and the two runtime
  # dependencies that cannot be statically linked into the exe ship in
  # the zip next to it (libmpv-2.dll; ffmpeg.exe/ffprobe.exe for
  # transcoding), pinned by sha256. The MSVC CRT is linked statically,
  # so no redistributable is required either.
  windows-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
            lib_machine: X64
            mpv_dev: mpv-dev-x86_64-20260809-git-dd5d17d328.7z
            mpv_sha256: c6aebf40bb722efe79090bfeb61e68625f0837770347e5a8b610aef78900cf12
            ffmpeg_zip: ffmpeg-N-126277-ga8c7afa7d7-win64-gpl.zip
            ffmpeg_sha256: 61f27cf0ea41eba2ccc8bbfd404d24925697725acca62f7af5f427f7ebb3e634
          - arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            msvc_arch: arm64
            lib_machine: ARM64
            mpv_dev: mpv-dev-aarch64-20260809-git-dd5d17d328.7z
            mpv_sha256: 0a56c6099ce988c2f79c07e93ae89213c2f27b87e166c002a2e1c2332336dcf2
            ffmpeg_zip: ffmpeg-N-126277-ga8c7afa7d7-winarm64-gpl.zip
            ffmpeg_sha256: 94b74956faf3ec56a3b6974a6d6acd35873266690b1b7514cad1a2cc42a52c8e
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      FFMPEG_RELEASE: autobuild-2026-08-26-13-06
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Build web UI
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
      - name: Fetch libmpv (pinned, checksum-verified)
        shell: pwsh
        run: |
          $u = "https://downloads.sourceforge.net/mpv-player-windows/libmpv/${{ matrix.mpv_dev }}"
          curl.exe -sfL -o mpv-dev.7z $u
          $h = (Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "${{ matrix.mpv_sha256 }}") { throw "libmpv checksum mismatch: $h" }
          7z x mpv-dev.7z -ompv-dev | Out-Null
      - name: Generate MSVC import library for libmpv
        shell: pwsh
        run: |
          $exports = dumpbin /exports mpv-dev/libmpv-2.dll
          $names = $exports | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') { $Matches[1] }
          }
          @("LIBRARY libmpv-2.dll", "EXPORTS") + $names | Set-Content mpv-dev/mpv.def -Encoding ascii
          lib /def:mpv-dev/mpv.def /machine:${{ matrix.lib_machine }} /out:mpv-dev/mpv.lib
      - name: Fetch ffmpeg (pinned, checksum-verified)
        shell: pwsh
        run: |
          $u = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_RELEASE/${{ matrix.ffmpeg_zip }}"
          curl.exe -sfL -o ffmpeg.zip $u
          $h = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "${{ matrix.ffmpeg_sha256 }}") { throw "ffmpeg checksum mismatch: $h" }
          7z x ffmpeg.zip -offmpeg-extract | Out-Null
      - name: Build (static CRT) + linkage check
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $env:STREAMX_MPV_LIB_DIR = "$PWD/mpv-dev"
          cargo build --release -p streamx-desktop --target ${{ matrix.target }}
          cargo run --release -p streamx-linkcheck --target ${{ matrix.target }} -- `
            target/${{ matrix.target }}/release/streamx-desktop.exe --policy windows-dist
      - name: Assemble zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/StreamX | Out-Null
          Copy-Item target/${{ matrix.target }}/release/streamx-desktop.exe dist/StreamX/
          Copy-Item mpv-dev/libmpv-2.dll dist/StreamX/
          $ffbin = Get-ChildItem ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffbin.FullName dist/StreamX/
          Copy-Item (Join-Path $ffbin.Directory ffprobe.exe) dist/StreamX/
          Compress-Archive -Path dist/StreamX -DestinationPath "dist/streamx-desktop-${{ matrix.arch }}-windows.zip"
      - name: Upload
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: pwsh
        run: gh release upload "${{ inputs.tag || github.ref_name }}" (Get-Item dist/*.zip) --clobber
