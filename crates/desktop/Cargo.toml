[package]
build = "build.rs"
name = "streamx-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "StreamX native desktop client (GPUI). Phase 3 hello-world."

[[bin]]
name = "streamx-desktop"
path = "src/main.rs"

[features]
# Links streamx-server and runs it in-process. Default.
# Phase 3 keeps this as a flag only; the server is not yet embedded.
default = []
embedded = []
# Thin client: no server, connect to a remote URL.
thin-client = []
# UI-test remote driver: JSON command listener on STREAMX_UI_TEST_PORT.
# Used by crates/ui-harness; never enabled in release builds. Pulls
# gpui/test-support for Window::render_to_image (OS-independent
# screenshots that are pixel-identical across platforms).
ui-test = ["gpui/test-support"]

[dependencies]
chrono = "0.4"
gpui.workspace = true

streamx-api = { path = "../api", features = ["client"] }
streamx = { path = "../server" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"
directories = "6"
libmpv2 = "6"

[dev-dependencies]
streamx-linkcheck = { path = "../linkcheck" }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# libmpv requires LC_NUMERIC="C" at init; pinned via setlocale. The
# Windows CRT locale is per-runtime and defaults to "C", so the fix
# does not apply there.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[build-dependencies]
pkg-config = "0.3"
