[package]
name = "streamx"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "streamx"

[[bin]]
name = "streamx"
path = "src/main.rs"

[features]
# Enables #[derive(TS)] on shared types so `cargo test --features ts-export`
# regenerates web/src/api/generated/*.ts. The default build does not pull
# ts-rs into the final binary; the derives are cfg-gated.
ts-export = ["streamx-api/ts-export", "dep:ts-rs"]

# Carry static ffmpeg/ffprobe executables inside the server binary.
# Requires STREAMX_FFMPEG_BIN and STREAMX_FFPROBE_BIN at compile time
# (paths to the binaries to embed); wired up by the Nix musl packages.
embed-ffmpeg = ["dep:sha2"]

[dependencies]
streamx-api = { path = "../api", features = ["client"] }
ts-rs = { version = "10", optional = true }
async-trait = "0.1"

axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = { version = "8", features = ["compression"] }
snafu = { version = "0.8", features = ["futures"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bcrypt = "0.16"
jsonwebtoken = "9"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "set-header"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
http = "1"
bytes = "1"
# rust-tls instead of default-tls: the default pulls native-tls and
# OpenSSL, which breaks the self-contained linkage policy.
librqbit = { version = "8", default-features = false, features = ["rust-tls", "http-api-client"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
urlencoding = "2"
scraper = "0.22"
dashmap = "6"
futures = "0.3"
lofty = "0.21"
sha2 = { version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
# FFmpeg shutdown signalling (SIGTERM/SIGKILL); Windows uses taskkill.
libc = "0.2"

[dev-dependencies]
streamx-linkcheck = { path = "../linkcheck" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
portpicker = "0.1"
serial_test = "3"
rstest = "0.24"
testcontainers = "0.28.0"
