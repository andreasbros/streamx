[package]
name = "streamx-ui-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform UI test harness: drives the desktop app via its ui-test driver, captures screenshots per OS, compares against baselines."

[[bin]]
name = "streamx-ui-harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
