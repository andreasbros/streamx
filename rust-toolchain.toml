[toolchain]
channel = "nightly"
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
targets = [
    # Linux: glibc for the GPUI desktop (host graphics stack must be
    # dynamic), musl for fully static server binaries.
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    # macOS: both CPU architectures.
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    # Windows desktop, both architectures. MSVC is the target Zed
    # supports for gpui; the targets here also enable
    # `cargo check --target <triple>` from any host (linking needs a
    # Windows runner).
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
profile = "default"
